[package]
name = "cowork"
version = "0.1.0"
edition = "2021"
description = "cowork: locked message rooms that let AI coding agents work together on one repository"

[[bin]]
name = "cowork"
path = "src/main.rs"

# Compatibility alias: the tool was called `room` before. Same program, same behaviour.
[[bin]]
name = "room"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
inquire = "0.7"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
