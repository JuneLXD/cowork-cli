<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">cowork overview</title>
  <desc id="d">Two coding agents, Claude Code as executor and Codex as advisor, and a human, all reading and writing one locked Markdown log per room. Editor hooks and a blocking wait deliver new messages into each agent session.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="960" height="400" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="38" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Two coding agents and a human, coordinating through one locked log</text>
  <!-- Claude -->
  <rect x="40" y="110" width="230" height="110" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="142" text-anchor="middle" font-weight="600" fill="#0f172a">Claude Code</text>
  <text x="155" y="166" text-anchor="middle" fill="#475569" font-size="13">executor</text>
  <text x="155" y="186" text-anchor="middle" fill="#475569" font-size="13">proposes, then edits files</text>
  <text x="155" y="206" text-anchor="middle" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cowork post --propose</text>
  <!-- Codex -->
  <rect x="690" y="110" width="230" height="110" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="805" y="142" text-anchor="middle" font-weight="600" fill="#0f172a">Codex</text>
  <text x="805" y="166" text-anchor="middle" fill="#475569" font-size="13">advisor</text>
  <text x="805" y="186" text-anchor="middle" fill="#475569" font-size="13">reviews against the code, votes</text>
  <text x="805" y="206" text-anchor="middle" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cowork post --re 12 --vote</text>
  <!-- Log -->
  <rect x="335" y="90" width="290" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="480" y="120" text-anchor="middle" font-weight="600" fill="#312e81" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">.ai-common/rooms/landing.md</text>
  <text x="480" y="148" text-anchor="middle" fill="#3730a3" font-size="13">one Markdown log per room</text>
  <text x="480" y="170" text-anchor="middle" fill="#3730a3" font-size="13">appended under a file lock</text>
  <text x="480" y="192" text-anchor="middle" fill="#3730a3" font-size="13">every message has an id</text>
  <text x="480" y="214" text-anchor="middle" fill="#3730a3" font-size="13">can be committed with the code</text>
  <!-- You -->
  <rect x="365" y="290" width="230" height="72" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="480" y="318" text-anchor="middle" font-weight="600" fill="#0f172a">You</text>
  <text x="480" y="342" text-anchor="middle" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cowork status · stream · post</text>
  <!-- arrows left -->
  <path d="M270 140 L333 140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="302" y="130" text-anchor="middle" fill="#475569" font-size="11">post</text>
  <path d="M333 190 L270 190" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="302" y="208" text-anchor="middle" fill="#475569" font-size="11">hooks, wait</text>
  <!-- arrows right -->
  <path d="M627 140 L688 140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="658" y="130" text-anchor="middle" fill="#475569" font-size="11">hooks, wait</text>
  <path d="M688 190 L627 190" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="658" y="208" text-anchor="middle" fill="#475569" font-size="11">post</text>
  <!-- arrow down -->
  <path d="M480 242 L480 288" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="480" y="385" text-anchor="middle" fill="#64748b" font-size="12">No remote service. The log is a file in the repository; an optional local watcher wakes waiting agents when it changes.</text>
</svg>
