<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">How a message reaches a turn-based agent</title>
  <desc id="d">Timeline after codex posts a message and the ways claude can receive it: a background wait returns once the message is in the log; the Stop hook turns unread messages into the next instruction when a turn ends; the UserPromptSubmit hook adds unread messages before the next prompt. Read, wait, Stop and UserPromptSubmit use the same per-agent read position. The SessionStart hook summarizes state, with unread counts and the latest handoff, without advancing it.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="960" height="380" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">How a message reaches a turn-based agent</text>
  <text x="480" y="58" text-anchor="middle" fill="#475569" font-size="12">Nothing can push text into a running session. New input arrives through a tool result, a hook, or a prompt. cowork uses each of them.</text>
  <line x1="60" y1="130" x2="900" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#0f172a" font-size="12" text-anchor="middle">
    <circle cx="150" cy="130" r="6" fill="#6366f1"/><text x="150" y="108">codex posts #12</text>
    <circle cx="380" cy="130" r="6" fill="#64748b"/><text x="380" y="108">claude's turn ends</text>
    <circle cx="610" cy="130" r="6" fill="#64748b"/><text x="610" y="108">you type a prompt</text>
    <circle cx="820" cy="130" r="6" fill="#64748b"/><text x="820" y="108">a session starts</text>
  </g>
  <!-- boxes: two rows, each 230 wide -->
  <g>
    <path d="M150 138 L150 158" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="160" width="230" height="78" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="155" y="184" text-anchor="middle" font-weight="600" fill="#312e81">background wait</text>
    <text x="155" y="206" text-anchor="middle" fill="#475569" font-size="12">cowork wait returns once</text>
    <text x="155" y="224" text-anchor="middle" fill="#475569" font-size="12">#12 is in the log</text>
  </g>
  <g>
    <path d="M380 138 L380 258" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="265" y="260" width="230" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="380" y="284" text-anchor="middle" font-weight="600" fill="#0f172a">Stop hook</text>
    <text x="380" y="306" text-anchor="middle" fill="#475569" font-size="12">unread messages become</text>
    <text x="380" y="324" text-anchor="middle" fill="#475569" font-size="12">the next instruction</text>
  </g>
  <g>
    <path d="M610 138 L610 158" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="495" y="160" width="230" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="610" y="184" text-anchor="middle" font-weight="600" fill="#0f172a">UserPromptSubmit hook</text>
    <text x="610" y="206" text-anchor="middle" fill="#475569" font-size="12">unread messages are added</text>
    <text x="610" y="224" text-anchor="middle" fill="#475569" font-size="12">to the context first</text>
  </g>
  <g>
    <path d="M820 138 L820 258" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="705" y="260" width="230" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="820" y="284" text-anchor="middle" font-weight="600" fill="#0f172a">SessionStart hook</text>
    <text x="820" y="306" text-anchor="middle" fill="#475569" font-size="12">identity, rooms, role,</text>
    <text x="820" y="324" text-anchor="middle" fill="#475569" font-size="12">unread counts, latest handoff</text>
  </g>
  <text x="480" y="366" text-anchor="middle" fill="#64748b" font-size="12">Read, wait, Stop and UserPromptSubmit use the same per-agent read position. SessionStart summarizes state without advancing it.</text>
</svg>
