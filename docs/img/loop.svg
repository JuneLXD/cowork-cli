<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Life of a proposal</title>
  <desc id="d">State diagram. A proposal starts pending. An approve moves it to approved, a reject to rejected, abstain-only votes leave it open. The executor closes an approved proposal with --complete, or posts a revision with --propose --re, which supersedes the old one. Only votes that name the proposal, from another participant, count, and only the latest per voter.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="960" height="360" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="600">Life of a proposal</text>
  <g font-weight="600" text-anchor="middle" font-size="14">
    <rect x="40" y="150" width="140" height="50" rx="25" fill="#fff7ed" stroke="#f59e0b"/><text x="110" y="180" fill="#92400e">pending</text>
    <rect x="290" y="70" width="140" height="50" rx="25" fill="#ecfdf5" stroke="#10b981"/><text x="360" y="100" fill="#065f46">approved</text>
    <rect x="290" y="190" width="140" height="50" rx="25" fill="#fef2f2" stroke="#ef4444"/><text x="360" y="220" fill="#991b1b">rejected</text>
    <rect x="290" y="280" width="140" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8"/><text x="360" y="307" fill="#334155" font-size="13">abstained</text>
    <rect x="560" y="70" width="140" height="50" rx="25" fill="#eef2ff" stroke="#6366f1"/><text x="630" y="100" fill="#312e81">completed</text>
    <rect x="560" y="190" width="140" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8"/><text x="630" y="220" fill="#334155">superseded</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 165 C 230 165, 230 95, 288 95"/>
    <path d="M180 180 C 230 180, 230 215, 288 215"/>
    <path d="M180 190 C 230 190, 230 302, 288 302"/>
    <path d="M430 95 L558 95"/>
    <path d="M430 215 L558 215"/>
    <path d="M360 188 L360 122" stroke-dasharray="4 3"/>
  </g>
  <g fill="#475569" font-size="12">
    <text x="232" y="122">approve</text>
    <text x="232" y="204">reject</text>
    <text x="222" y="270">abstain only</text>
    <text x="494" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">--complete --re N</text>
    <text x="494" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">--propose --re N</text>
    <text x="494" y="262" text-anchor="middle" font-size="11">a revision is a new proposal</text>
    <text x="372" y="160" font-size="11">same reviewer changes</text>
    <text x="372" y="174" font-size="11">vote to approve</text>
    <text x="360" y="345" text-anchor="middle" font-size="11">still open: nobody has decided</text>
  </g>
  <rect x="740" y="70" width="190" height="254" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="835" y="96" text-anchor="middle" font-weight="600" fill="#0f172a">What counts</text>
  <g fill="#334155" font-size="12">
    <text x="754" y="122">A vote counts only if it</text>
    <text x="754" y="142">• names the proposal (--re N)</text>
    <text x="754" y="162">• is from another participant</text>
    <text x="754" y="182">• is that voter's latest on N</text>
    <text x="754" y="212">One approve approves.</text>
    <text x="754" y="232">Any reject blocks, even if</text>
    <text x="754" y="250">another reviewer approved.</text>
    <text x="754" y="280">Other votes are shown as</text>
    <text x="754" y="298">informational; they never</text>
    <text x="754" y="316">change the state.</text>
  </g>
</svg>
